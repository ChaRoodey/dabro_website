server {
    listen 443 ssl http2;
    server_name dabro-sun.ru www.dabro-sun.ru;

    ssl_certificate /etc/letsencrypt/live/dabro-sun.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dabro-sun.ru/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /shop {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /robots.txt {
        try_files /robots.txt =404;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        try_files /favicon.ico =404;
        access_log off;
        log_not_found off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        return 404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}

server {
    listen 443 ssl http2;
    server_name api.dabro-sun.ru;

    ssl_certificate /etc/letsencrypt/live/dabro-sun.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dabro-sun.ru/privkey.pem;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name grafana.dabro-sun.ru;

    ssl_certificate /etc/letsencrypt/live/dabro-sun.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dabro-sun.ru/privkey.pem;

    location / {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name dabro-sun.ru www.dabro-sun.ru api.dabro-sun.ru grafana.dabro-sun.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}